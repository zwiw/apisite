<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD cu API</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1> Produse</h1>

    <form id="product-form">
      <input type="text" id="name" placeholder="Nume produs" required>
      <input type="number" id="price" placeholder="Preț" required min="0">
      <button type="submit" id="submit-btn">Adaugă</button>
      <button type="button" id="cancel-btn" style="display:none;">Anulează</button>
    </form>

    <div id="status"></div>
    <ul id="product-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
